documentar_negocio_task:
  description: >
    Analise a base de código e a documentação de negócio existente. Atualize a documentação de nível L1,
    garantindo que ela descreva corretamente os fluxos de negócio e operações disponíveis sob a ótica de 
    usuários ou sistemas externos interagindo com o projeto.

    Para cada funcionalidade identificada:
    - Descreva a ação que o sistema permite do ponto de vista do usuário/sistema externo.
    - Detalhe como realizar essa ação, informando os parâmetros necessários e as regras de negócio aplicáveis.
    - Especifique o endpoint ou mecanismo utilizado para executar a ação.
    - Inclua o fluxo operacional, requisitos e comportamentos esperados.

    **Caso a resposta da ação contenha identificadores ou informações adicionais relevantes 
    (ex: `metric_id`, `tracking_code`, `token`), documente seu propósito, a forma como podem 
    ser utilizados e seu valor para o usuário ou para futuras funcionalidades, mesmo que não haja 
    um endpoint de consulta implementado no momento.**

    Caso não exista uma documentação de negócio oficial, utilize o template de documentação fornecido 
    como referência estrutural, preenchendo os tópicos aplicáveis de acordo com a análise do projeto.

    Se existir documentação oficial:
    - Atualize com novas funcionalidades, ações, regras e fluxos detectados.
    - Ajuste ou remova informações desatualizadas.
    - Inclua melhorias na estrutura de descrição, seguindo o modelo do template. Somente se precisar.
    - **Revise a seção de "⚠️ Pontos de Risco e Sugestões", atualizando ou removendo riscos que já foram mitigados 
      pelas funcionalidades implementadas (como a consulta de métricas via `metric_id`), e mantendo apenas os pontos 
      que ainda se aplicam.**

    Localização do código: {code_path}
    Localização da documentação de negócio: {business_documentation_path}
    Localização de um template de documentação de negócio: {template_L1}

  expected_output: >
    Um arquivo Markdown contendo:
    - Descrição geral do projeto.
    - Objetivos de negócio principais implementados.
    - Funcionalidades disponíveis descritas pelo que o usuário pode fazer.
    - Para cada funcionalidade: o que permite, como usar, requisitos/parâmetros, o endpoint utilizado e 
      qualquer identificador ou dado relevante retornado.
    - Fluxos de operação sob a ótica do usuário ou sistema externo.
    - Regras de negócio e restrições atualizadas.
    - Entradas e saídas esperadas do sistema.
    - Integrações com sistemas externos (se houver).
    - Principais pontos de risco e sugestões de melhoria sob a ótica de negócio, revisadas conforme 
      funcionalidades atualmente disponíveis.

  agent: business_documentator
  output_file: '{business_documentation_path}'

process_code_changes_task:
  description: >
    Receber um diff de código originado por um evento de Pull Request e analisar as alterações realizadas.
    Identificar blocos de código adicionados e removidos, classificando as alterações por tipo e contexto de negócio.

    Para cada alteração:
    - Identificar o arquivo e a linha impactada.
    - Categorizar se é uma adição, remoção ou modificação.
    - Determinar o tipo de alteração (ex: criação de endpoint, modificação de regra de negócio, adição de integração, ajuste em log ou validação).
    - Avaliar se há impacto em funcionalidades já documentadas.
    - Detectar possíveis relações de dependência ou quebra de fluxo.

    Ao final da análise:
    - Gerar um relatório estruturado contendo as alterações detectadas.
    - Encaminhar esse relatório para o agente `business_documentator` para que ele atualize a documentação de negócio correspondente.

    Ignore informações de mensagens de commit, baseando sua análise unicamente no conteúdo do diff.

  expected_output: >
    Um arquivo JSON ou Markdown contendo:
    - Lista de arquivos modificados.
    - Blocos de código adicionados e removidos por arquivo.
    - Classificação de cada alteração por tipo e contexto.
    - Sugestão de quais documentações ou fluxos de negócio precisam ser atualizados.
    - Potenciais riscos ou dependências associadas às alterações.
    - Indicação de quais alterações podem ser ignoradas para fins de documentação de negócio.

  agent: code_diff_analyzer
  input_file: '{diff_file}'
  output_file: '{diff_analysis_report}'

pr_webhook_handler_task:
  description: >
    Recebe os dados da notificação via webhook sobre novas pull requests criadas no repositório.
    A partir dos dados recebidos:
    - Gere o diff entre a branch de origem e a branch de destino.
    - Salve o diff em um arquivo temporário.
    - Acione a task `process_code_changes_task` passando esse diff como entrada.
    - Em seguida, encaminhe o relatório gerado para a `business_documentator_task` para atualização da documentação.

    A análise deve ser baseada no conteúdo das alterações de código, mesmo se a mensagem de commit estiver inadequada.

  expected_output: >
    Execução sequencial:
    1. Geração do diff da PR.
    2. Execução da task `process_code_changes_task`.
    3. Execução da task `business_documentator_task` com base no relatório.

  agent: pr_webhook_listener
